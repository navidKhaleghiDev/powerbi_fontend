name: powerbi-local
services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: bi_source
      POSTGRES_USER: bi_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run npm run stack:init first}
      CDC_PASSWORD: ${POSTGRES_CDC_PASSWORD:?Missing CDC password}
    command:
      [
        postgres,
        -c,
        wal_level=logical,
        -c,
        max_replication_slots=10,
        -c,
        max_wal_senders=10,
        -c,
        max_slot_wal_keep_size=1024MB,
      ]
    ports: ["127.0.0.1:${BI_POSTGRES_PORT:-55432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-source.sh:/docker-entrypoint-initdb.d/01-source.sh:ro
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
  kafka-storage-init:
    image: apache/kafka:4.1.2
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /kafka-data"]
    volumes: [kafka_data:/kafka-data]
    restart: "no"
  kafka:
    depends_on:
      kafka-storage-init: {condition: service_completed_successfully}
    image: apache/kafka:4.1.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka_data:/tmp/kraft-combined-logs]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: 1g
  connect:
    image: quay.io/debezium/connect:3.7
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: powerbi-connect
      CONFIG_STORAGE_TOPIC: powerbi_connect_configs
      OFFSET_STORAGE_TOPIC: powerbi_connect_offsets
      STATUS_STORAGE_TOPIC: powerbi_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["127.0.0.1:${BI_CONNECT_PORT:-18083}:8083"]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "curl -fsS http://localhost:8083/connector-plugins >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: bi_warehouse
      CLICKHOUSE_USER: bi_app
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run npm run stack:init first}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:${BI_CLICKHOUSE_PORT:-18123}:8123"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./deploy/clickhouse/local.xml:/etc/clickhouse-server/config.d/local.xml:ro
      - ./deploy/clickhouse/users.xml:/etc/clickhouse-server/users.d/local.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test:
        [
          CMD-SHELL,
          'clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    mem_limit: 2g
  app:
    image: powerbi-local-app:connected
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      connect: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      CONTROL_CENTER_DATA_DIR: /app/.data
      LOCAL_STACK_ENABLED: "1"
      LOCAL_PROVIDER_PASSWORD: ${LOCAL_PROVIDER_PASSWORD:?Missing generated provider password}
      LOCAL_CUSTOMER_PASSWORD: ${LOCAL_CUSTOMER_PASSWORD:?Missing generated customer password}
      POSTGRES_CDC_PASSWORD: ${POSTGRES_CDC_PASSWORD:?Missing CDC password}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Missing warehouse password}
    ports: ["${BI_APP_BIND:-0.0.0.0}:${BI_APP_PORT:-3003}:3001"]
    volumes: ["./.data/compose-workspace:/app/.data"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "require('http').get('http://127.0.0.1:3001/api/auth/session',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1g
volumes:
  postgres_data:
  kafka_data:
  clickhouse_data:
  clickhouse_logs:
